backend:
  name: github
  repo: gaosonbarbershop/gaoson-barbershop
  branch: main
  base_url: https://gaoson-cms-oauth.YOUR-WORKER-SUBDOMAIN.workers.dev
  auth_endpoint: auth

publish_mode: simple
media_folder: "public/images/sneakers"
public_folder: "/images/sneakers"
locale: fr
site_url: https://gaoson-barbershop.fr
display_url: https://gaoson-barbershop.fr
logo_url: /favicon.ico

collections:
  - name: sneakers
    label: "Drop · Sneakers & Lifestyle"
    label_singular: "Sneaker"
    folder: "content/sneakers"
    create: true
    delete: true
    slug: "{{order}}-{{slug}}"
    summary: "{{order}} · {{brand}} {{model}} — {{status}}"
    sortable_fields: [order, brand]
    fields:
      - { name: order, label: "Ordre d'affichage", widget: number, value_type: int, default: 99, hint: "Plus petit = en haut de la grille" }
      - { name: brand, label: "Marque", widget: string }
      - { name: model, label: "Modèle", widget: string }
      - { name: size, label: "Pointure", widget: string, hint: "Ex. US 9 / EU 42.5" }
      - { name: condition, label: "État", widget: select, options: ["Neuf — DS", "Neuf — boîte d'origine", "Très bon état", "Très bon état — portée", "Bon état", "Sur demande"], default: "Neuf — DS" }
      - { name: price, label: "Prix (€)", widget: number, value_type: int, required: false, hint: "Laisser vide pour 'Sur demande'" }
      - { name: status, label: "Statut", widget: select, options: ["available", "reserved", "sold"], default: "available" }
      - { name: image, label: "Photo principale", widget: image, allow_multiple: false, choose_url: false }
      - { name: body, label: "Description courte", widget: text, required: false, hint: "Une à deux phrases — apparaît en survol." }
